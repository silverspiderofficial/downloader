name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      BUILD_NAME: 1.0.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Analyze (must be zero issues)
        run: flutter analyze

      - name: Dart unit tests
        run: flutter test

      - name: Prepare Gradle project
        run: flutter build apk --config-only

      - name: Kotlin unit tests (queue, worker pool, retry, recovery)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Decode release keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          PROPS

      - name: Build per-ABI APKs
        run: >
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/symbols
          --target-platform android-arm,android-arm64,android-x64
          --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Keep per-ABI outputs
        run: |
          mkdir -p dist
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk   "$GITHUB_WORKSPACE/dist/downloader-$BUILD_NAME-arm64-v8a.apk"
          cp app-armeabi-v7a-release.apk "$GITHUB_WORKSPACE/dist/downloader-$BUILD_NAME-armeabi-v7a.apk"
          cp app-x86_64-release.apk      "$GITHUB_WORKSPACE/dist/downloader-$BUILD_NAME-x86_64.apk"

      - name: Build universal APK
        run: >
          flutter build apk --release
          --obfuscate --split-debug-info=build/symbols
          --target-platform android-arm,android-arm64,android-x64
          --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Collect outputs, checksums and permission report
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "dist/downloader-$BUILD_NAME-universal.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          ls -la
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          echo "== Permissions in universal APK =="
          "$AAPT2" dump permissions "downloader-$BUILD_NAME-universal.apk"
          echo "== Native libraries =="
          unzip -l "downloader-$BUILD_NAME-universal.apk" | grep 'lib/' | awk '{print $1, $4}'
          if [ "$HAS_KEYSTORE" = "true" ]; then echo "SIGNING=release keystore" >> $GITHUB_ENV; else echo "SIGNING=debug key (no KEYSTORE secrets set)" >> $GITHUB_ENV; fi

      - uses: actions/upload-artifact@v4
        with:
          name: downloader-apks-${{ env.BUILD_NAME }}
          path: dist/*

      # نمادهای مبهم‌سازی Dart فقط به‌صورت artifact (نه در Release و نه در APK)
      - uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ env.BUILD_NAME }}
          path: |
            build/symbols
            build/app/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_NAME }}
          name: دانلودر همه‌کاره ${{ env.BUILD_NAME }} (مرحلهٔ ۱)
          make_latest: true
          body: |
            دانلودر همه‌کاره — مرحلهٔ ۱: دانلود با انتخاب کیفیت، ادغام صدا و تصویر، صف موازی در پروسهٔ جدا، کار در پس‌زمینه.
            اندروید ۷ (API 24) به بالا.

            کدام فایل را نصب کنم؟
            • universal: اگر مطمئن نیستید (روی همهٔ گوشی‌ها کار می‌کند، حجم بیشتر)
            • arm64-v8a: تقریباً همهٔ گوشی‌های امروزی
            • armeabi-v7a: گوشی‌های قدیمی ۳۲ بیتی
            • x86_64: شبیه‌ساز / تبلت‌های اینتل

            همیشه یک نوع را نصب کنید (مثلاً همیشه universal) تا به‌روزرسانی روی نسخهٔ قبلی نصب شود.
            هش SHA-256 همهٔ فایل‌ها در SHA256SUMS.txt است.
            امضا: ${{ env.SIGNING }}

            متن‌باز (GPL-3.0)، بدون تبلیغ و آمارگیری.
          files: dist/*
